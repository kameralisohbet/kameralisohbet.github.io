<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Görüntülü Sohbet Odaları | Kameralı Chat Platformları</title>
    <meta name="description" content="Ücretsiz, üyeliksiz canlı görüntülü sohbet ve kameralı chat odaları. Kesintisiz WebRTC altyapısıyla anında sohbet başlatın.">
    <meta name="robots" content="index, follow">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            display: block;
            padding: 15px 20px;
            background: linear-gradient(45deg, #0284c7, #6366f1);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Canlı Görüntülü Sohbet Odaları</h1>
        <p>Kesintisiz WebRTC teknolojisiyle güçlendirilmiş, üyeliksiz ve donmasız kameralı sohbet ağımıza hoş geldiniz. Aşağıdaki platformlarımız üzerinden anında canlı sohbete katılabilirsiniz.</p>
        
        <div class="btn-grid">
            <a href="https://www.sohbete.com.tr" class="btn" target="_blank">Sohbete.com.tr'ye Katıl</a>
            <a href="https://omegletv.tr" class="btn" target="_blank">OmegleTV.tr Giriş</a>
            <a href="https://goruntuluchat.tr" class="btn" target="_blank">GoruntuluChat.tr Başlat</a>
        </div>
    </div>
</body>
</html>
